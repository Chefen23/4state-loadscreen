<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; media-src https:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Loading</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <video id="background-video" autoplay loop playsinline preload="auto" disablepictureinpicture aria-hidden="true"></video>

  <p id="message" role="status" hidden></p>

  <div class="audio-controls" role="group" aria-label="Video sound controls">
    <button id="mute" type="button" aria-label="Mute sound" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M11 5 6 9H3v6h3l5 4Z"/>
        <path id="sound-waves" d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/>
        <path id="sound-off" d="m16 9 6 6m0-6-6 6" hidden/>
      </svg>
      <span id="mute-label">Mute</span>
    </button>
    <span class="divider" aria-hidden="true"></span>
    <label class="sr-only" for="volume">Volume</label>
    <input id="volume" type="range" min="0" max="100" step="1" value="25" aria-valuetext="25 percent">
    <output id="volume-value" for="volume">25%</output>
  </div>

  <progress id="loading-progress" max="1" value="0" aria-label="Server loading progress"></progress>
</body>
</html>
